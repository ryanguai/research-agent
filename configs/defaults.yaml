corpus:
  categories:
    - "cs.CL"
    - "cs.LG"
  subtopic_query: "RAG retrieval-augmented generation"
  max_results: 500
  months_back: 18

chunking:
  overlap_sentences: 2

embedding:
  model: "BAAI/bge-small-en-v1.5"

retrieval:
  top_k: 10
  rerank_top_k: 5

generation:
  provider: "gemini"       # ollama (free/local), openai, gemini, groq
  model: null              # null = use provider default (llama3.2 for ollama)
  temperature: 0.1
  max_tokens: 1024
