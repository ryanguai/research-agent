[project]
name = "research-agent"
version = "0.1.0"
description = "AI Research Paper Q&A Agent with RAG, eval suite, and retrieval comparison"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=2.1",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "rank-bm25>=0.2",
    "streamlit>=1.35",
    "structlog>=24.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
